apiVersion: apps/v1
kind: Deployment
metadata:
  name: picas-fijas
spec:
  replicas: 3
  selector:
    matchLabels:
      app: picas-fijas
  template:
    metadata:
      labels:
        app: picas-fijas
    spec:
      containers:
        - name: picas-fijas
          image: deezzeagle/picas-fijas:1.1
          ports:
            - containerPort: 3000
          env:
            - name: REDIS_URL
              value: redis://redis:6379
